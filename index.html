<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Para Zai ♡</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="stars"></div>
  <div class="glow"></div>

  <main class="scene">

    <!-- PANTALLA INICIAL -->
    <section id="intro" class="screen active">

      <div class="tiny-heart">♡</div>

      <p class="eyebrow">
        UNA PEQUEÑA SORPRESA
      </p>

      <h1>
        Para
        <span>Zai</span>
      </h1>

      <p class="intro-text">
        Hay algo que quería decirte...
      </p>

      <button id="startBtn">
        Abrir ♡
      </button>

    </section>


    <!-- MENSAJE -->
    <section id="message" class="screen">

      <div class="heart-orbit">
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
        <span>♡</span>
      </div>

      <p class="eyebrow">
        PARA TI, ZAI
      </p>

      <div id="typedMessage" class="message"></div>

      <div id="ending" class="ending">

        <div class="big-heart">
          ♥
        </div>

        <p>
          Me alegra mucho haberte conocido, Zai.
        </p>

        <small>
          ♡
        </small>

      </div>

    </section>

  </main>

  <div id="hearts"></div>

  <script src="script.js"></script>

</body>
</html>
